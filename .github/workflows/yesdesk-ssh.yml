name: YES Desk SSH

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/yesdesk-ssh.yml'
      - 'flutter/lib/yesdesk/**'
      - 'flutter/lib/common/widgets/peer_tab_page.dart'
      - 'flutter/test/**'
      - 'flutter/third_party/dartssh2/**'
      - 'flutter/pubspec.*'
      - 'scripts/test-yesdesk-ssh-openssh.sh'

permissions:
  contents: read

jobs:
  ssh:
    name: SSH tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true
      - name: Resolve pinned Flutter dependencies
        working-directory: flutter
        run: flutter pub get --enforce-lockfile
      - name: Check formatting
        working-directory: flutter
        run: dart format --output=none --set-exit-if-changed lib/yesdesk/ssh lib/common/widgets/peer_tab_page.dart test/yesdesk_ssh
      - name: Analyze SSH and workspace navigation
        working-directory: flutter
        run: |
          flutter analyze --no-pub lib/yesdesk/ssh test/yesdesk_ssh
          flutter analyze --no-pub --no-fatal-infos lib/common/widgets/peer_tab_page.dart
      - name: Run units, widgets and workspace regressions
        working-directory: flutter
        run: flutter test --no-pub
      - name: Install OpenSSH server
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
      - name: Test direct SSH against isolated OpenSSH
        if: runner.os == 'Linux'
        run: scripts/test-yesdesk-ssh-openssh.sh
